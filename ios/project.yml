name: Battleships
options:
  bundleIdPrefix: com.abgames
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.1"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "10.22.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"

targets:
  Battleships:
    type: application
    platform: iOS
    sources:
      - path: Battleships
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abgames.battleships
        PRODUCT_NAME: Battleships
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Battleships
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SocketIO
        product: SocketIO
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Battleships/Info.plist
      properties:
        NSAppTransportSecurity:
          NSExceptionDomains:
            battleships-server-jtit.onrender.com:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true

  BattleshipsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BattleshipsWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abgames.battleships.widget
        PRODUCT_NAME: BattleshipsWidget
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
    info:
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - target: Battleships
        embed: false
